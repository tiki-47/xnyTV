server:
  port: 8080

spring:
  application:
    name: tvservice
  datasource:
    url: jdbc:mysql://localhost:3306/tv_management?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.xny.tvservice.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    cn.xny.tvservice: debug
    root: info

# 自定义配置
tv:
  websocket:
    path: /ws
    heartbeat-timeout: 60000       # 心跳超时时间(ms)，超过此时间未收到心跳则离线
    heartbeat-check-interval: 30000 # 心跳检测周期(ms)
